
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-portal
      version: blue
  template:
    metadata:
      labels:
        app: food-portal
        version: blue
    spec:
      containers:
        - name: food-portal
          image: monashree1511/food-ordering-portal:v1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
